<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Scène « Live » — Landers2K</title>
  <!-- Scène OBS (source « Navigateur » en 2560 × 1440, fond transparent), à placer juste au-dessus de « Camera 2 » dans LIVE :
       cadre autour de la webcam (1871, 37 · 652 × 367 : tout en haut à droite, 20 px de marge) et bandeau des liens juste en dessous. Pas de cubes : le jeu reste dégagé. -->
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/overlay/scenes.css?v=7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,600..800&display=swap">
  <style>
    .goals { position: absolute; width: 684px; padding: 14px 16px 18px; box-sizing: border-box; border-radius: 20px; background: rgba(10, 14, 30, .82); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .1), 0 14px 40px -12px rgba(0, 0, 0, .7); }
    .goals p { margin: 0 0 8px; color: #b8bccb; font-size: 22px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .goals i { display: block; height: 34px; margin-bottom: 18px; border-radius: 10px; background: rgba(255, 255, 255, .05); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 45%, transparent); }
    .goals i:last-child { margin-bottom: 0; }
    /* Dans OBS, Streamlabs dessine la barre des dons environ 10 px plus bas que celle des followers :
       le rail des dons descend d'autant */
    .goals i:first-of-type { margin-bottom: 26px; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="frame" style="left:1871px;top:37px;width:652px;height:367px;box-shadow:none"></div>
    <!-- Bandeau compact (480 × 90, plus 40 px pour son ombre) agrandi à la largeur de la webcam -->
    <iframe src="/overlay/?compact" title="Bandeau Landers2K" scrolling="no"
      style="position:absolute;left:1871px;top:432px;width:480px;height:130px;border:0;background:transparent;transform:scale(1.3583);transform-origin:0 0"></iframe>
    <!-- Objectifs Streamlabs, en haut à gauche (en miroir de la webcam) : les deux barres se posent sur ces rails (652 × 34) :
         widget 800 × 600 rogné de 18 / 8 / 18 / 552 px, puis mis à l'échelle 0,8534 -->
    <div class="goals" style="left:20px;top:20px">
      <p>🎯 Objectif followers</p>
      <i style="--c:#2997ff"></i>
      <p>🎁 Objectif dons</p>
      <i style="--c:#ffd60a"></i>
    </div>
  </div>
  <script>
    // Dessinée en 2560 × 1440, adaptée à la taille de la source OBS
    const stage = document.querySelector('.stage');
    const fit = () => { stage.style.transform = `scale(${Math.min(innerWidth / 2560, innerHeight / 1440)})`; };
    addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
